<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Hours</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <p class="label">AI has worked for you</p>
    <p id="total" class="total">…</p>
    <div id="breakdown" class="breakdown"></div>
    <p id="unknown" class="note" hidden></p>
    <section id="account" class="account">
      <p id="acct-text" class="note"></p>
      <div class="acct-buttons">
        <button type="button" id="signin" class="primary" hidden>Sign in with Google</button>
        <button type="button" id="syncnow" hidden>Sync now</button>
        <button type="button" id="signout" hidden>Sign out</button>
        <button type="button" id="wipe" class="danger" hidden>Delete synced data</button>
      </div>
      <div id="confirm" class="confirm" hidden>
        <p class="note">Delete everything synced to your account? This device keeps its history, and you'll be signed out.</p>
        <button type="button" id="wipe-yes" class="danger">Delete</button>
        <button type="button" id="wipe-no">Cancel</button>
      </div>
    </section>
    <p id="health" class="note warn" hidden>Some responses were only detected one way. A chat site may have changed, so the count could be incomplete.</p>
  </main>
  <script src="../src/total.js"></script>
  <script src="../src/models.js"></script>
  <script src="../src/breakdown-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
